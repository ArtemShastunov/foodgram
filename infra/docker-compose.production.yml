volumes:
  pg_data:
  static_volume:
  media_volume:

services:
  db:
    image: postgres:15
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always

  backend:
    image: artemdecide/foodgram_backend:latest
    env_file: .env
    depends_on:
      - db
    volumes:
      - static_volume:/app/collected_static
      - media_volume:/app/media
    restart: always

  frontend:
    image: artemdecide/foodgram_frontend:latest
    env_file: .env
    volumes:
      - static_volume:/frontend_static
    command: cp -r /app/build/. /frontend_static/
    restart: "no"

  gateway:
    image: artemdecide/foodgram_gateway:latest
    env_file: .env
    depends_on:
      - backend
      - frontend
    volumes:
      - static_volume:/static
      - media_volume:/media
    ports:
      - "80:80"
    restart: always
